spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
jwt.secret=test-secret-chave-minima-256-bits-para-testes-sentinela-1234567890ab
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000
hmac.secret=test-hmac-secret-64-bytes-minimo-para-testes-unitarios-1234567890abcdef
jasypt.encryptor.password=test-jasypt-key
admin.username=admin
admin.password=Admin@test123
cors.allowed-origins=http://localhost:3000
rate.limit.requests-per-minute=1000
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
