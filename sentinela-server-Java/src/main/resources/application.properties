# ===== APPLICATION =====
spring.application.name=sentinela-server
server.port=8080

# ===== GRACEFUL SHUTDOWN (RNF10) =====
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===== DATABASE =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentinela}
spring.datasource.username=${DB_USERNAME:sentinela_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ===== FLYWAY =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===== HMAC (shared with agent — RNF03) =====
hmac.secret=${HMAC_SECRET}

# ===== CRYPTO (RNF03) =====
crypto.private-key-path=classpath:keys/private_key.pem
crypto.public-key-path=classpath:keys/public_key.pem

# ===== JASYPT (encrypt sensitive props) =====
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}
jasypt.encryptor.algorithm=PBEWithMD5AndDES

# ===== RATE LIMITING =====
rate.limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:100}

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}

# ===== ACTUATOR (RNF12) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ===== ADMIN INITIALIZATION =====
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:Admin@changeme123}
admin.reset-password=${ADMIN_RESET_PASSWORD:false}

# ===== LOGGING =====
logging.level.root=INFO
logging.level.br.edu.sentinela=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
